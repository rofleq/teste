
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frickbears 3</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#game-container {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #000;
}

#game {
    position: absolute;
    width: 100%;
    height: 100%;
    border: 0;
}

#fullscreen {
    position: fixed;
    z-index: 10;
    right: 12px;
    bottom: 12px;
    padding: 10px 15px;
    color: white;
    background: #222;
    border: 1px solid #555;
    border-radius: 6px;
    cursor: pointer;
}

#fullscreen:hover {
    background: #444;
}
</style>
</head>

<body>

<div id="game-container">
    <iframe
        id="game"
        src="https://www.miniplay.com/embed/five-nights-at-frickbears-3"
        allow="autoplay; fullscreen; gamepad"
        allowfullscreen>
    </iframe>
</div>

<button id="fullscreen">⛶ Fullscreen</button>

<script>
const game = document.getElementById("game");

document.getElementById("fullscreen").addEventListener("click", () => {
    if (!document.fullscreenElement) {
        game.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
});
</script>

</body>
</html>
