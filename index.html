
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frickbears 3</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#load-error {
    position: fixed;
    inset: 0;
    z-index: 999999;
    display: none;
    align-items: center;
    justify-content: center;
    background: #000;
    color: white;
    font: 14px Arial;
    text-align: center;
}

#load-error div {
    max-width: 400px;
    padding: 25px;
}

#load-error button {
    margin-top: 15px;
    padding: 10px 20px;
    background: #333;
    border: 1px solid #666;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="load-error">
    <div>
        <h2>Unable to load Frickbears 3</h2>
        <p id="error-text">The original game source could not be loaded.</p>
        <button onclick="location.reload()">Try Again</button>
    </div>
</div>

<script>
(async function () {

    const SOURCE =
        "https://raw.githubusercontent.com/Reeyuki/frickbears3port/main/index.html";

    try {
        const response = await fetch(SOURCE, {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("GitHub returned HTTP " + response.status);
        }

        let html = await response.text();

        // Keep the original game's asset paths working.
        html = html.replace(
            "<head>",
            '<head><base href="https://reeyuki.github.io/frickbears3port/">'
        );

        // Make the original game fill the screen.
        const extraCSS = `
html, body {
    width: 100% !important;
    height: 100% !important;
    min-width: 0 !important;
    min-height: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
    overflow: hidden !important;
    background: #000 !important;
}

body {
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
    align-items: center !important;
}

canvas.emscripten {
    max-width: 100vw !important;
    max-height: 100vh !important;
    margin: auto !important;
}

div.loading {
    position: fixed !important;
    inset: 0 !important;
    background: #000 !important;
    z-index: 1000 !important;
}

#progress {
    width: min(80vw, 400px) !important;
    height: 12px !important;
    padding: 0 !important;
}

#status {
    font-family: Arial, sans-serif !important;
    font-size: 14px !important;
}

.spinner {
    border-color: #fff !important;
    border-top-color: #777 !important;
}

.output-container,
#message-container,
.floating-control,
.wallpaper-container {
    display: none !important;
}

#pauseMenuContainer {
    z-index: 5000;
}
`;

        const styleEnd = html.lastIndexOf("</style>");

        if (styleEnd === -1) {
            throw new Error("Original game stylesheet not found.");
        }

        html =
            html.slice(0, styleEnd) +
            extraCSS +
            html.slice(styleEnd);

        // Remove the advertising scripts.
        html = html.replace(
            /<script async[\s\S]*?<\/script>\s*<script>[\s\S]*?<\/script>/,
            ""
        );

        // Launch the original game without replacing its loader.
        document.open();
        document.write(html);
        document.close();

    } catch (error) {
        console.error("Frickbears loading error:", error);

        document.getElementById("error-text").textContent =
            error.message;

        document.getElementById("load-error").style.display = "flex";
    }

})();
</script>

</body>
</html>
